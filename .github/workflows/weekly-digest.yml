name: Weekly Email Digest

on:
  schedule:
    - cron: '0 9 * * 1'   # 9am UTC every Monday
  workflow_dispatch:        # also triggerable manually from GitHub Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger weekly digest API route
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "https://anshul.ai/api/cron/weekly-digest" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $response"
          cat /tmp/response.json
          if [ "$response" -ge 400 ]; then
            echo "Weekly digest request failed with status $response"
            exit 1
          fi
