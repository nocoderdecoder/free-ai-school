name: AI Path disposable PostgreSQL proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ai-path-db-proof.yml'
      - 'scripts/ai-path-db-proof.sh'
      - 'scripts/ai-path-db-proof-preflight.mjs'
      - 'scripts/ai-path-db-proof/**'
      - 'supabase/migrations/*_ai_path_*.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-path-db-proof.yml'
      - 'scripts/ai-path-db-proof.sh'
      - 'scripts/ai-path-db-proof-preflight.mjs'
      - 'scripts/ai-path-db-proof/**'
      - 'supabase/migrations/*_ai_path_*.sql'

permissions:
  contents: read

concurrency:
  group: ai-path-db-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-postgres-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify proof sources without a database connection
        run: node scripts/ai-path-db-proof-preflight.mjs --source-only --json

      - name: Ensure the PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
          node scripts/ai-path-db-proof-preflight.mjs --json

      - name: Bootstrap the fresh CI-only compatibility roles and proof database
        run: >-
          psql 'postgresql://postgres@127.0.0.1:5432/postgres'
          -X -v ON_ERROR_STOP=1
          -v ci_disposable_confirmation=I_UNDERSTAND_THIS_CI_CLUSTER_IS_DISPOSABLE
          -f scripts/ai-path-db-proof/ci-bootstrap.sql

      - name: Run behavioral migration, RLS, RPC, retention, and race proof
        env:
          AI_PATH_DB_PROOF_DISPOSABLE: I_UNDERSTAND_THIS_DATABASE_WILL_BE_MUTATED
          AI_PATH_DB_PROOF_URL: postgresql://postgres@127.0.0.1:5432/ai_path_proof_ci
        run: |
          set -o pipefail
          scripts/ai-path-db-proof.sh 2>&1 | tee ai-path-db-proof.log

      - name: Upload content-free proof log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-path-db-proof-${{ github.run_id }}
          path: ai-path-db-proof.log
          if-no-files-found: warn
          retention-days: 14
